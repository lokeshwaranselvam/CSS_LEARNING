<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>List Styling</h1>
    </header>
    <main>
        <h2>Ordered List</h2>
        <ol start="5" reversed>
            <li>first item</li>
            <li value="25">second item</li>
            <li>Third item</li>
        </ol>
        <h2>Unordered List</h2>
        <ul>
            <li>Item one</li>
            <li>Item two</li>
            <li>Item three</li>
        </ul>
    </main>
    
</body>
</html>
